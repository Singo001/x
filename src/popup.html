<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordklar</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup">
  <header class="row"><div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M17.7 6.6A7.5 7.5 0 1 0 19 14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="m10 10 3 3 7-8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>ordklar</div><span class="local-tag">100% lokalt</span></header>
  <h1>Skriv med ro.</h1>
  <p class="intro">Lidt hjælp til ordene. Plads til din stemme.<br>Hold musen over en markering for at rette.</p>
  <div class="card controls">
    <div class="row"><div><label class="setting-label" for="enabled">Korrektur</label><span class="muted small" id="enabled-label">Aktiv i dine tekstfelter</span></div><label class="toggle"><input id="enabled" type="checkbox" checked aria-label="Aktivér korrektur"><span></span></label></div>
    <div class="divider"></div>
    <span class="setting-label">Jeg skriver på</span>
    <div class="language" aria-label="Sprog"><button type="button" data-language="da" aria-pressed="true">Dansk <span aria-hidden="true">· DA</span></button><button type="button" data-language="en" aria-pressed="false">English <span aria-hidden="true">· EN</span></button></div>
    <div class="divider"></div>
    <div class="row"><div><label class="setting-label" for="grammar">Grammatik</label><span class="muted small">Almindelige fejl og gentagelser</span></div><label class="toggle"><input id="grammar" type="checkbox" checked aria-label="Aktivér grammatikregler"><span></span></label></div>
  </div>
  <button class="button dictionary-link" id="options"><div><strong>Din ordliste</strong><span id="term-count">Egne ord, fagudtryk og kryptotermer</span></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 5 7 7-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
  <div class="privacy"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.7"/></svg>Din tekst forlader aldrig din browser</div>
  <script src="popup.js"></script>
</body></html>
